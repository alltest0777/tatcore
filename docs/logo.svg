<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TatCoin logo</title>
  <desc id="desc">A symmetrical gold ring containing a minimalist T shaped like a shield.</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="48%" stop-color="#F2B01E"/>
      <stop offset="100%" stop-color="#D99000"/>
    </linearGradient>
  </defs>

  <!-- Gold ring with a small opening at the bottom -->
  <path
    d="M256 42
       A214 214 0 1 1 241 469"
    fill="none"
    stroke="url(#gold)"
    stroke-width="28"
    stroke-linecap="butt"/>

  <!-- Top bar of the T -->
  <path
    d="M142 154
       H370
       L342 190
       H170
       Z"
    fill="url(#gold)"/>

  <!-- Symmetrical T / shield body -->
  <path
    d="M178 210
       H334
       L350 230
       V337
       Q350 363 330 382
       L274 432
       V210
       H238
       V432
       L182 382
       Q162 363 162 337
       V230
       Z

       M190 246
       V332
       Q190 346 201 357
       L238 390
       V246
       Z

       M274 246
       V390
       L311 357
       Q322 346 322 332
       V246
       Z"
    fill="url(#gold)"
    fill-rule="evenodd"/>

  <!-- Central continuation to the ring opening -->
  <rect x="238" y="210" width="36" height="270" fill="url(#gold)"/>
</svg>
