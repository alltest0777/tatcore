name: Build and Release TatCoin

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/tatcoind-${GOOS}-${GOARCH} \
            ./cmd/tatcoind

      - name: Generate checksum
        run: |
          cd dist
          sha256sum tatcoind-${{ matrix.goos }}-${{ matrix.goarch }} \
            > tatcoind-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tatcoind-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/tatcoind-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/tatcoind-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tatcoind-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/tatcoind-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
